# Supabase pausa los proyectos gratuitos tras una semana sin uso.
# Esta tarea hace una consulta dos veces por semana para que eso no pase.
name: Mantener Supabase activo

on:
  schedule:
    - cron: '17 11 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consultar la base de datos
        run: |
          url=$(sed -n "s/.*supabaseUrl: '\([^']*\)'.*/\1/p" js/config.js)
          key=$(sed -n "s/.*supabaseAnonKey: '\([^']*\)'.*/\1/p" js/config.js)
          if [ -z "$url" ] || [ -z "$key" ]; then
            echo "Supabase aún no está configurado en js/config.js; nada que hacer."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 30 \
            -H "apikey: $key" \
            "$url/rest/v1/projects?select=id&limit=1" > /dev/null
          echo "Listo."
